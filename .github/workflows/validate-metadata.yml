name: Validar metadados do dataset
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do dataset
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar os quatro CSVs
        run: python scripts/validate_dataset.py --metadata-dir metadata --output-dir validation_output
      - name: Exibir resumo no GitHub Actions
        if: always()
        shell: bash
        run: |
          if test -f validation_output/validation_report.md; then
            cat validation_output/validation_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório não foi gerado." >> "$GITHUB_STEP_SUMMARY"
          fi
