name: Validar metadados e versão de distribuição
on:
  push:
    branches: [main, 'snapshot/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do dataset
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conferir tabelas originais
        run: python scripts/validate_dataset.py --metadata-dir metadata --output-dir validation_output
      - name: Conferir a distribuição v1.0.0
        run: python scripts/check_release.py
      - name: Resumo da auditoria
        if: always()
        shell: bash
        run: |
          if test -f validation_output/validation_report.md; then
            cat validation_output/validation_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório não disponível." >> "$GITHUB_STEP_SUMMARY"
          fi
